version: "3.8"
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: fraud-api
    environment:
      APP_NAME: fraud-detector
      MODEL_PATH: training/models/model.joblib
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: 300
      RATE_LIMIT_PER_MINUTE: 120
      LOG_LEVEL: INFO
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped

  app-dev:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: fraud-api-dev
    environment:
      APP_NAME: fraud-detector
      MODEL_PATH: training/models/model.joblib
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: 300
      RATE_LIMIT_PER_MINUTE: 120
      LOG_LEVEL: INFO
      PYTHONPATH: /app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ../app:/app/app
      - ../training:/app/training
      - ../utils:/app/utils
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: fraud-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    restart: unless-stopped

networks:
  default:
    name: fraud-net
